[package]
name = "multi-boot"
version = "0.1.0"
edition = "2021"
authors = ["Multi-Boot Contributors"]
description = "A tool to create multi-ISO bootable USB drives with BIOS and UEFI support"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lplatzer/multi-boot"
keywords = ["usb", "boot", "iso", "grub", "uefi"]
categories = ["command-line-utilities"]

[[bin]]
name = "multi-boot"
path = "src/main.rs"

[[bin]]
name = "multi-boot-gui"
path = "src/gui/main.rs"
required-features = ["gui"]

[dependencies]
clap = { version = "4", features = ["derive", "cargo"] }
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
indicatif = "0.17"
regex = "1"
byte-unit = "5"
libc = "0.2"

# GUI dependencies (optional)
eframe = { version = "0.27", optional = true }
poll-promise = { version = "0.3", optional = true }
rfd = { version = "0.14", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
gui = ["eframe", "poll-promise", "rfd"]
